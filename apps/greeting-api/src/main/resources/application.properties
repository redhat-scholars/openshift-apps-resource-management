quarkus.application.name=greeting-api

# The four languages import.sql seeds in the tutorial application. The values deliberately
# differ from the ones seeded there (Salut for ro and fr, not Salut/Bonjour), so a student
# can see that MessageInitializer really did overwrite the rows at startup.
greeting.translations.en=Hello
greeting.translations.es=Hola
greeting.translations.ro=Salut
greeting.translations.fr=Salut
# Spare languages, so there is something to try beyond the seeded four.
greeting.translations.de=Hallo
greeting.translations.it=Ciao
greeting.translations.pt=Ola
greeting.translations.nl=Hallo

# Jib and quay.io, the same path the tutorial itself documents. Override the group with
# -Dquarkus.container-image.group=<your-quay-org> or by exporting REGISTRY_ORG.
quarkus.container-image.builder=jib
quarkus.container-image.registry=quay.io
quarkus.container-image.group=${REGISTRY_ORG:rhdevelopers}
quarkus.container-image.name=greeting-api

# Students call this from their laptop in dev mode and the cluster calls it from inside, so
# it has to be reachable both ways. An edge-terminated Route is the one URL that is.
quarkus.openshift.route.expose=true
quarkus.openshift.route.tls.termination=edge
quarkus.openshift.route.tls.insecure-edge-termination-policy=Redirect

# Deliberately small: this runs alongside the tutorial application in a Sandbox namespace
# whose quota the tutorial then spends several chapters filling up on purpose.
quarkus.openshift.resources.requests.cpu=50m
quarkus.openshift.resources.requests.memory=64Mi
quarkus.openshift.resources.limits.cpu=500m
quarkus.openshift.resources.limits.memory=256Mi
