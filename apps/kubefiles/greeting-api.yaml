# The greeting service the tutorial application calls at startup, deployed from the
# ImageStream that `oc start-build greeting-api` produced in the current namespace.
#
# The image is written as a bare `greeting-api:latest` and resolved to the internal
# registry by the annotation below. To run a registry image instead, apply this file and
# then point the Deployment at it:
#
#   oc set image deployment/greeting-api greeting-api=quay.io/<your-org>/greeting-api:1.0-SNAPSHOT
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeting-api
  labels:
    app: greeting-api
  annotations:
    # Rewrites `greeting-api:latest` below into the full internal-registry pull spec. A
    # fully qualified name such as quay.io/... is left untouched, so the same file works
    # for both build paths.
    alpha.image.policy.openshift.io/resolve-names: '*'
    image.openshift.io/triggers: |
      [{"from":{"kind":"ImageStreamTag","name":"greeting-api:latest"},
        "fieldPath":"spec.template.spec.containers[?(@.name==\"greeting-api\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greeting-api
  template:
    metadata:
      labels:
        app: greeting-api
    spec:
      containers:
        - name: greeting-api
          image: greeting-api:latest
          ports:
            - name: http
              containerPort: 8080
          # Add a language without rebuilding, for example:
          #   oc set env deployment/greeting-api GREETING_TRANSLATIONS_JA=Konnichiwa
          env:
            - name: JAVA_APP_JAR
              value: quarkus-run.jar
          # Small on purpose: this shares a Sandbox namespace with a tutorial that spends
          # several chapters deliberately filling the quota up.
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /q/health/started
              port: 8080
            failureThreshold: 12
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: greeting-api
  labels:
    app: greeting-api
spec:
  # Port 80 so the in-cluster URL is a plain http://greeting-api, matching the Route and
  # keeping one URL shape in the docs. `oc new-app` would publish 8080 here instead.
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app: greeting-api
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: greeting-api
  labels:
    app: greeting-api
spec:
  to:
    kind: Service
    name: greeting-api
  port:
    targetPort: http
  # Students call this from their laptop in dev mode and the cluster calls it from inside.
  # An edge-terminated Route is the one URL that answers in both places.
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
